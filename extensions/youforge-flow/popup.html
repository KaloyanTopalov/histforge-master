<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>YouForge Flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-row">
        <img src="logo-48.png" alt="YouForge Flow" width="36" height="36">
        <div class="header-text">
          <h1>YouForge Flow</h1>
          <span class="version">v0.1.1</span>
        </div>
      </div>
    </header>

    <form id="config-form" class="config-form" autocomplete="off">
      <section class="section">
        <h2 class="section-title">Connection</h2>
        <div class="field">
          <label for="histforge-domain">HistForge domain</label>
          <input type="url" id="histforge-domain" name="histforgeDomain" placeholder="http://localhost:3000" spellcheck="false" autocomplete="off">
        </div>
        <div class="field">
          <label for="account-token">Account token</label>
          <input type="password" id="account-token" name="accountToken" placeholder="Paste from HistForge" spellcheck="false" autocomplete="off">
        </div>
        <p class="field-hint" id="derived-urls-hint" hidden>Webhook URLs auto-derived from domain + token.</p>
      </section>

      <section class="section">
        <h2 class="section-title">General</h2>
        <div class="grid-2">
          <div class="field field-half">
            <label for="image-concurrency">Image concurrency (1–10)</label>
            <input type="number" id="image-concurrency" name="imageConcurrency" min="1" max="10" value="5" step="1">
          </div>
          <div class="field field-half">
            <label for="video-concurrency">Video concurrency (1–10)</label>
            <input type="number" id="video-concurrency" name="videoConcurrency" min="1" max="10" value="3" step="1">
          </div>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="verbose-logging" name="verboseLogging">
          Verbose logging (debug)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="notifications-enabled" name="notificationsEnabled" checked>
          Show Chrome notifications (e.g. session expired)
        </label>
      </section>

      <section class="section">
        <h2 class="section-title">Character lock</h2>
        <div class="field">
          <label for="character-lock-reference">Character lock entity ID</label>
          <input type="text" id="character-lock-reference" name="characterLockReference" placeholder="622f1a75-b4f1-45a8-9d77-948e0e93c8f7" spellcheck="false" autocomplete="off">
          <p class="field-hint">A saved Flow Character's <code>entityId</code> UUID. See <code>docs/setup-guides/setup-google-flow.md</code> &rarr; &quot;Step: Lock a character&quot; for how to capture it. Empty = no lock.</p>
          <p class="field-error" id="character-lock-error" hidden></p>
        </div>
      </section>

      <details class="advanced">
        <summary class="section-title">Advanced</summary>
        <div id="advanced-root"></div>
      </details>
    </form>

    <div class="action-row">
      <button type="button" id="grant-btn" class="btn btn-grant" hidden>Grant HistForge access</button>
      <button type="button" id="start-btn" class="btn btn-start" disabled>Start</button>
      <button type="button" id="stop-btn" class="btn btn-stop" hidden>Stop</button>
      <button type="button" id="test-btn" class="btn btn-test">Test connection</button>
    </div>

    <div class="status-line" id="status-line" aria-live="polite">Idle</div>
    <ul class="self-test-results" id="self-test-results" hidden></ul>
  </div>

  <script src="src/constants.js"></script>
  <script src="src/settings-schema.js"></script>
  <script src="popup.js"></script>
</body>
</html>
